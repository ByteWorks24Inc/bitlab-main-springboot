spring.application.name=backend
# ===============================
# SERVER
# ===============================
server.port=8080


# ===============================
# DATABASE CONFIG
# Override DB_URL / DB_USER / DB_PASSWORD in hosted environments.
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myapp}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# ===============================
# SESSION
# ===============================
server.servlet.session.timeout=30m


# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG


# ===============================
# BITLAB CUSTOM CONFIG
# ===============================
bitlab.workspace-root=./workspace
bitlab.execution-timeout-seconds=10
